# Build, test and deploy to GitHub Pages on every push to main.
# Needs repository VARIABLES (public values only): VITE_SUPABASE_URL,
# VITE_SUPABASE_PUBLISHABLE_KEY, VITE_VAPID_PUBLIC_KEY. No secrets are used here.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (RLS on PGlite, Edge Functions with mocked Anthropic, unit)
        run: npm test
      - name: Safety scan of every tracked file
        run: npm run scan
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - name: No secrets in the bundle
        run: |
          if grep -rEq 'sb_secret_[A-Za-z0-9_-]{8,}|sk-ant-[A-Za-z0-9_-]{16,}' dist; then echo "secret found in dist"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
